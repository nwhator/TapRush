<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TapRush: Mind Games</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;700;800;900&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .kinetic-glow {
            box-shadow: 0 0 20px rgba(193, 255, 254, 0.2);
        }
        .neon-pulse {
            background: radial-gradient(circle at center, rgba(193, 255, 254, 0.05) 0%, transparent 70%);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-secondary": "#47001f",
                      "surface-bright": "#2c2c2c",
                      "on-surface-variant": "#adaaaa",
                      "secondary-dim": "#e30071",
                      "on-secondary-fixed-variant": "#a1004e",
                      "secondary-container": "#ba005b",
                      "surface-container-high": "#20201f",
                      "primary": "#c1fffe",
                      "primary-fixed": "#00f5f5",
                      "outline-variant": "#484847",
                      "on-primary-fixed": "#004343",
                      "surface-tint": "#c1fffe",
                      "on-secondary-fixed": "#6c0032",
                      "error-container": "#9f0519",
                      "surface-container-lowest": "#000000",
                      "surface-variant": "#262626",
                      "tertiary-dim": "#49e043",
                      "inverse-primary": "#006a6a",
                      "surface-container-highest": "#262626",
                      "on-secondary-container": "#fff5f6",
                      "tertiary-fixed": "#59ee50",
                      "on-error-container": "#ffa8a3",
                      "inverse-on-surface": "#565555",
                      "on-primary-fixed-variant": "#006262",
                      "background": "#0e0e0e",
                      "tertiary": "#69fd5d",
                      "on-tertiary-fixed": "#003e03",
                      "on-primary": "#006767",
                      "on-tertiary-fixed-variant": "#005f07",
                      "inverse-surface": "#fcf9f8",
                      "surface-dim": "#0e0e0e",
                      "secondary-fixed-dim": "#ffadc2",
                      "on-tertiary-container": "#005406",
                      "on-background": "#ffffff",
                      "tertiary-fixed-dim": "#49e043",
                      "error-dim": "#d7383b",
                      "secondary-fixed": "#ffc1d0",
                      "primary-container": "#00ffff",
                      "tertiary-container": "#59ee50",
                      "secondary": "#ff6b9b",
                      "on-primary-container": "#005d5d",
                      "outline": "#767575",
                      "surface-container": "#1a1a1a",
                      "on-surface": "#ffffff",
                      "error": "#ff716c",
                      "on-error": "#490006",
                      "primary-fixed-dim": "#00e6e6",
                      "surface": "#0e0e0e",
                      "primary-dim": "#00e6e6",
                      "surface-container-low": "#131313",
                      "on-tertiary": "#005e07"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "fontFamily": {
                      "headline": ["Spline Sans"],
                      "body": ["Plus Jakarta Sans"],
                      "label": ["Plus Jakarta Sans"]
              }
            },
          },
        }
      </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body selection:bg-primary selection:text-on-primary">
<header class="fixed top-0 w-full z-50 bg-transparent backdrop-blur-xl flex justify-between items-center px-6 py-4 w-full no-border bg-gradient-to-b from-black/80 to-transparent">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-cyan-400 text-2xl active:scale-90 transition-transform cursor-pointer" data-icon="bolt">bolt</span>
<h1 class="text-2xl italic tracking-widest text-cyan-400 drop-shadow-[0_0_8px_rgba(34,211,238,0.8)] font-headline tracking-tighter uppercase font-black">TAPRUSH</h1>
</div>
<div class="flex items-center">
<span class="material-symbols-outlined text-neutral-500 hover:scale-110 hover:text-white transition-all duration-300 cursor-pointer" data-icon="settings">settings</span>
</div>
</header>
<main class="relative min-h-screen flex flex-col items-center justify-center overflow-hidden pt-20 pb-32 px-6">
<div class="absolute inset-0 pointer-events-none overflow-hidden">
<div class="absolute top-1/4 -left-20 w-96 h-96 neon-pulse rounded-full opacity-30"></div>
<div class="absolute bottom-1/4 -right-20 w-80 h-80 neon-pulse rounded-full opacity-20" style="background: radial-gradient(circle at center, rgba(255, 107, 155, 0.1) 0%, transparent 70%);"></div>
<div class="absolute top-0 left-0 w-full h-full opacity-10">
<div class="absolute top-1/3 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-primary to-transparent"></div>
<div class="absolute top-2/3 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-secondary to-transparent rotate-12"></div>
<div class="absolute top-1/2 left-0 w-full h-[2px] bg-gradient-to-r from-transparent via-tertiary to-transparent -rotate-6"></div>
</div>
</div>
<div class="relative z-10 flex flex-col items-center text-center">
<div class="mb-2">
<span class="inline-block px-3 py-1 bg-surface-container-highest rounded-full text-xs font-bold tracking-[0.2em] uppercase text-primary border border-primary/10 mb-4">MIND CHALLENGE MODE</span>
</div>
<h2 class="text-6xl md:text-8xl font-headline font-black italic tracking-tighter text-on-surface drop-shadow-2xl mb-2">
                TAP<span class="text-primary drop-shadow-[0_0_15px_rgba(193,255,254,0.6)]">RUSH</span>
</h2>
<p class="text-on-surface-variant font-medium tracking-wide mb-12">Are your reflexes sharp enough?</p>
<button class="group relative flex items-center justify-center w-64 h-64 rounded-full bg-primary-container text-on-primary-container transition-all duration-300 active:scale-95 shadow-[0_0_50px_rgba(0,255,255,0.4)] hover:shadow-[0_0_80px_rgba(0,255,255,0.6)] overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-tr from-primary to-primary-fixed opacity-90 group-hover:opacity-100"></div>
<div class="relative flex flex-col items-center">
<span class="material-symbols-outlined text-6xl mb-2" data-icon="play_arrow" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
<span class="text-xl font-headline font-black uppercase tracking-widest">START GAME</span>
</div>
<div class="absolute inset-0 border-[8px] border-white/20 rounded-full scale-90 group-hover:scale-100 transition-transform duration-500"></div>
</button>
<div class="mt-16 grid grid-cols-2 gap-4 w-full max-w-sm">
<div class="p-6 bg-surface-container-low rounded-xl flex flex-col items-start gap-1">
<span class="text-[10px] font-bold uppercase tracking-widest text-on-surface-variant">Daily Best</span>
<span class="text-2xl font-headline font-black text-tertiary">14,200</span>
</div>
<div class="p-6 bg-surface-container-low rounded-xl flex flex-col items-start gap-1">
<span class="text-[10px] font-bold uppercase tracking-widest text-on-surface-variant">Global Rank</span>
<span class="text-2xl font-headline font-black text-secondary">#254</span>
</div>
</div>
</div>
</main>
<div class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-10 pt-3 bg-[#0e0e0e]/90 backdrop-blur-2xl rounded-t-[2rem] no-border shadow-[0_-4px_24px_rgba(0,255,255,0.1)]">
<div class="flex items-center justify-center bg-cyan-400/20 text-cyan-400 rounded-full w-14 h-14 shadow-[0_0_15px_rgba(0,255,255,0.4)] active:scale-95 duration-100 cursor-pointer">
<span class="material-symbols-outlined" data-icon="home" style="font-variation-settings: 'FILL' 1;">home</span>
</div>
<div class="flex items-center justify-center text-neutral-600 w-14 h-14 hover:text-cyan-200 transition-colors active:scale-95 duration-100 cursor-pointer">
<span class="material-symbols-outlined" data-icon="leaderboard">leaderboard</span>
</div>
<div class="flex items-center justify-center text-neutral-600 w-14 h-14 hover:text-cyan-200 transition-colors active:scale-95 duration-100 cursor-pointer">
<span class="material-symbols-outlined" data-icon="emoji_events">emoji_events</span>
</div>
<div class="flex items-center justify-center text-neutral-600 w-14 h-14 hover:text-cyan-200 transition-colors active:scale-95 duration-100 cursor-pointer">
<span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>
</div>
</div>
<div class="fixed top-1/2 right-4 -translate-y-1/2 flex flex-col gap-4 z-40 opacity-50 hover:opacity-100 transition-opacity">
<div class="w-1 h-12 rounded-full bg-surface-container-highest overflow-hidden">
<div class="h-1/2 w-full bg-primary shadow-[0_0_10px_rgba(193,255,254,0.8)]"></div>
</div>
</div>
</body></html>
