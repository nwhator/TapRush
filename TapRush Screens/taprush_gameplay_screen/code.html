<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TapRush: Mind Games</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;700;900&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-secondary": "#47001f",
                    "surface-bright": "#2c2c2c",
                    "on-surface-variant": "#adaaaa",
                    "secondary-dim": "#e30071",
                    "on-secondary-fixed-variant": "#a1004e",
                    "secondary-container": "#ba005b",
                    "surface-container-high": "#20201f",
                    "primary": "#c1fffe",
                    "primary-fixed": "#00f5f5",
                    "outline-variant": "#484847",
                    "on-primary-fixed": "#004343",
                    "surface-tint": "#c1fffe",
                    "on-secondary-fixed": "#6c0032",
                    "error-container": "#9f0519",
                    "surface-container-lowest": "#000000",
                    "surface-variant": "#262626",
                    "tertiary-dim": "#49e043",
                    "inverse-primary": "#006a6a",
                    "surface-container-highest": "#262626",
                    "on-secondary-container": "#fff5f6",
                    "tertiary-fixed": "#59ee50",
                    "on-error-container": "#ffa8a3",
                    "inverse-on-surface": "#565555",
                    "on-primary-fixed-variant": "#006262",
                    "background": "#0e0e0e",
                    "tertiary": "#69fd5d",
                    "on-tertiary-fixed": "#003e03",
                    "on-primary": "#006767",
                    "on-tertiary-fixed-variant": "#005f07",
                    "inverse-surface": "#fcf9f8",
                    "surface-dim": "#0e0e0e",
                    "secondary-fixed-dim": "#ffadc2",
                    "on-tertiary-container": "#005406",
                    "on-background": "#ffffff",
                    "tertiary-fixed-dim": "#49e043",
                    "error-dim": "#d7383b",
                    "secondary-fixed": "#ffc1d0",
                    "primary-container": "#00ffff",
                    "tertiary-container": "#59ee50",
                    "secondary": "#ff6b9b",
                    "on-primary-container": "#005d5d",
                    "outline": "#767575",
                    "surface-container": "#1a1a1a",
                    "on-surface": "#ffffff",
                    "error": "#ff716c",
                    "on-error": "#490006",
                    "primary-fixed-dim": "#00e6e6",
                    "surface": "#0e0e0e",
                    "primary-dim": "#00e6e6",
                    "surface-container-low": "#131313",
                    "on-tertiary": "#005e07"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Spline Sans"],
                    "body": ["Plus Jakarta Sans"],
                    "label": ["Plus Jakarta Sans"]
            }
          },
        }
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #0e0e0e;
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
        }
        .neon-glow-cyan {
            box-shadow: 0 0 40px rgba(193, 255, 254, 0.3), inset 0 0 20px rgba(193, 255, 254, 0.2);
        }
        .neon-glow-lime {
            box-shadow: 0 0 40px rgba(105, 253, 93, 0.3), inset 0 0 20px rgba(105, 253, 93, 0.2);
        }
        .rush-meter-bloom {
            box-shadow: 0 0 15px #c1fffe;
        }
        .asymmetric-data-cluster {
            clip-path: polygon(0 0, 100% 0, 95% 100%, 5% 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface flex flex-col h-screen overflow-hidden select-none">
<!-- TopAppBar Fragmented for Gameplay Focus -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-6 py-4 w-full bg-transparent backdrop-blur-xl no-border bg-gradient-to-b from-black/80 to-transparent">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-cyan-400 text-2xl" data-icon="bolt">bolt</span>
<h1 class="text-2xl italic tracking-widest text-cyan-400 drop-shadow-[0_0_8px_rgba(34,211,238,0.8)] font-['Spline_Sans'] tracking-tighter uppercase font-black">TAPRUSH</h1>
</div>
<button class="text-neutral-500 hover:scale-110 hover:text-white transition-all duration-300 active:scale-90 transition-transform">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</header>
<!-- Main Gameplay Canvas -->
<main class="flex-grow flex flex-col items-center justify-center relative px-6 pt-24 pb-12">
<!-- Rush Meter (Timer) -->
<div class="w-full max-w-md absolute top-24 px-8 flex flex-col gap-2">
<div class="flex justify-between items-end mb-1">
<span class="font-headline text-[10px] uppercase tracking-[0.2em] text-on-surface-variant font-bold">Time Remaining</span>
<span class="font-headline text-lg font-black text-primary leading-none">08:42</span>
</div>
<div class="h-1.5 w-full bg-surface-variant rounded-full overflow-hidden">
<div class="h-full w-2/3 bg-gradient-to-r from-primary to-tertiary relative">
<div class="absolute right-0 top-0 bottom-0 w-1 rush-meter-bloom bg-white"></div>
</div>
</div>
</div>
<!-- High-End Asymmetric Score Cluster -->
<div class="w-full max-w-md flex justify-between items-start mb-12">
<div class="flex flex-col">
<span class="font-label text-[10px] uppercase tracking-widest text-on-surface-variant mb-1">Current Points</span>
<div class="font-headline text-7xl font-black tracking-tighter text-on-surface flex items-baseline">
                    12,450 <span class="text-lg text-primary ml-2 tracking-normal">PTS</span>
</div>
</div>
<div class="flex flex-col items-end">
<span class="font-label text-[10px] uppercase tracking-widest text-on-surface-variant mb-1">Rank</span>
<div class="font-headline text-4xl font-black italic text-tertiary">#04</div>
</div>
</div>
<!-- Central Gameplay Area: The Kinetic Orb -->
<div class="relative group cursor-pointer active:scale-95 transition-transform duration-75">
<!-- Dynamic Glow Layer -->
<div class="absolute -inset-12 bg-primary/10 blur-[60px] rounded-full group-active:bg-secondary/20 transition-colors"></div>
<!-- Success Feedback Area -->
<div class="absolute -inset-4 border border-primary/20 rounded-full animate-pulse"></div>
<!-- Main Interaction Circle -->
<div class="relative w-64 h-64 md:w-80 md:h-80 rounded-full flex items-center justify-center bg-gradient-to-br from-surface-container-high to-surface-container-lowest border-2 border-primary/30 neon-glow-cyan transition-all duration-300">
<div class="flex flex-col items-center">
<span class="font-headline text-5xl font-black text-on-surface tracking-tighter mb-2">TAP</span>
<div class="w-12 h-1 bg-primary rounded-full group-active:bg-tertiary transition-colors"></div>
</div>
<!-- Inner Decorative Tech-Rings -->
<div class="absolute inset-4 border border-outline-variant/10 rounded-full"></div>
<div class="absolute inset-8 border-t-2 border-primary/40 rounded-full"></div>
</div>
</div>
<!-- Success/Failure Feedback Indicator -->
<div class="mt-12 opacity-80">
<div class="flex items-center gap-3 px-6 py-2 bg-surface-container-low rounded-full border border-outline-variant/10">
<div class="w-2 h-2 rounded-full bg-tertiary"></div>
<span class="font-label text-xs font-bold uppercase tracking-widest text-on-surface">Precision: 98%</span>
</div>
</div>
<!-- Level Indicator (Bento-style card) -->
<div class="absolute bottom-32 w-full max-w-xs bg-surface-container-low rounded-xl p-4 flex items-center justify-between shadow-2xl">
<div class="flex flex-col">
<span class="font-label text-[10px] uppercase text-on-surface-variant tracking-wider font-bold">Complexity</span>
<span class="font-headline text-xl font-bold text-on-surface uppercase italic">Overload</span>
</div>
<div class="h-10 w-px bg-outline-variant/20 mx-4"></div>
<div class="flex flex-col items-end">
<span class="font-label text-[10px] uppercase text-on-surface-variant tracking-wider font-bold">Stage</span>
<span class="font-headline text-xl font-black text-secondary">Lvl 24</span>
</div>
</div>
</main>
<!-- BottomNavBar (Only Shell, suppress during high-focus gameplay if needed, but keeping for top-level navigation) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-3 bg-[#0e0e0e]/90 backdrop-blur-2xl no-border shadow-[0_-4px_24px_rgba(0,255,255,0.1)] rounded-t-[2rem]">
<a class="flex items-center justify-center bg-cyan-400/20 text-cyan-400 rounded-full w-14 h-14 shadow-[0_0_15px_rgba(0,255,255,0.4)] transition-all duration-300 active:scale-95" href="#">
<span class="material-symbols-outlined" data-icon="home" style="font-variation-settings: 'FILL' 1;">home</span>
</a>
<a class="flex items-center justify-center text-neutral-600 w-14 h-14 hover:text-cyan-200 transition-colors active:scale-95 duration-100" href="#">
<span class="material-symbols-outlined" data-icon="leaderboard">leaderboard</span>
</a>
<a class="flex items-center justify-center text-neutral-600 w-14 h-14 hover:text-cyan-200 transition-colors active:scale-95 duration-100" href="#">
<span class="material-symbols-outlined" data-icon="emoji_events">emoji_events</span>
</a>
<a class="flex items-center justify-center text-neutral-600 w-14 h-14 hover:text-cyan-200 transition-colors active:scale-95 duration-100" href="#">
<span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>
</a>
</nav>
<!-- Background Decorative elements to maintain "Electric Pulse" feel -->
<div class="fixed top-1/4 -left-32 w-64 h-64 bg-secondary/5 blur-[120px] pointer-events-none"></div>
<div class="fixed bottom-1/4 -right-32 w-96 h-96 bg-primary/5 blur-[150px] pointer-events-none"></div>
</body></html>
