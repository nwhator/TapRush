<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-transparent backdrop-blur-xl no-border bg-gradient-to-b from-black/80 to-transparent flex justify-between items-center px-6 py-4">
<div class="flex items-center gap-2 active:scale-90 transition-transform">

</div>

<main class="pt-24 pb-32 px-6 max-w-2xl mx-auto space-y-10">

<section class="space-y-2">
<h2 class="font-headline text-4xl font-black uppercase tracking-tighter text-neon-cyan">Settings</h2>
<div class="flex items-center gap-2">
<div class="h-1 w-12 bg-primary"></div>
<span class="font-label text-xs uppercase tracking-widest text-on-surface-variant font-bold">Configure your rush</span>
</div>
</section>
<!-- Theme Selection: Bento Style -->
<section class="space-y-4">
<label class="font-label text-xs uppercase tracking-[0.2em] font-bold text-on-surface-variant px-1">Visual Architecture</label>
<div class="grid grid-cols-1 md:grid-cols-3 gap-4">
<!-- Light -->
<button class="group relative overflow-hidden bg-surface-container-low rounded-xl p-4 flex flex-col items-center justify-center gap-3 border border-outline-variant/10 hover:bg-surface-container-high transition-all">
<div class="w-10 h-10 rounded-full bg-white flex items-center justify-center">
<span class="material-symbols-outlined text-surface" data-icon="light_mode">light_mode</span>
</div>
<span class="font-label text-[10px] font-bold uppercase tracking-widest">Light</span>
</button>
<!-- Dark -->
<button class="group relative overflow-hidden bg-surface-container-low rounded-xl p-4 flex flex-col items-center justify-center gap-3 border border-outline-variant/10 hover:bg-surface-container-high transition-all">
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface" data-icon="dark_mode">dark_mode</span>
</div>
<span class="font-label text-[10px] font-bold uppercase tracking-widest">Dark</span>
</button>
<!-- Neon Kineticism (Active) -->
<button class="group relative overflow-hidden bg-primary/10 rounded-xl p-4 flex flex-col items-center justify-center gap-3 border border-primary/40 shadow-[0_0_20px_rgba(193,255,254,0.15)] transition-all">

<span class="material-symbols-outlined text-on-primary" data-icon="electric_bolt" style="font-variation-settings: 'FILL' 1;">electric_bolt</span>
</div>
<span class="font-label text-[10px] font-bold uppercase tracking-widest text-primary">Neon Kineticism</span>
</button>
</div>
</section>
<!-- Tap Effects: High Energy Chips -->
<section class="space-y-4">
<label class="font-label text-xs uppercase tracking-[0.2em] font-bold text-on-surface-variant px-1">Kinetic Feedback</label>
<div class="bg-surface-container-low rounded-2xl p-6 space-y-6">
<div class="flex flex-wrap gap-3">
<!-- Fire Chip -->
<button class="flex items-center gap-3 px-6 py-4 bg-surface-container-highest rounded-full border border-secondary/20 hover:border-secondary transition-all group">
<span class="material-symbols-outlined text-secondary group-hover:scale-110 transition-transform" data-icon="local_fire_department" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
<span class="font-label text-sm font-bold uppercase tracking-wider">Fire</span>
</button>
<!-- Neon Chip (Selected) -->
<button class="flex items-center gap-3 px-6 py-4 bg-primary/20 rounded-full border-2 border-primary shadow-[0_0_15px_rgba(0,255,255,0.3)] transition-all group">
<span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform" data-icon="flare">flare</span>
<span class="font-label text-sm font-bold uppercase tracking-wider text-primary">Neon</span>
</button>

<span class="material-symbols-outlined text-tertiary group-hover:scale-110 transition-transform" data-icon="bolt" style="font-variation-settings: 'FILL' 1;">bolt</span>

</div>
<div class="absolute bottom-2 right-4 text-[10px] uppercase font-bold tracking-widest text-on-surface-variant/50">Effect Preview</div>

<label class="font-label text-xs uppercase tracking-[0.2em] font-bold text-on-surface-variant px-1">Acoustic Immersion</label>

<div>

</div>
<button class="relative inline-flex h-8 w-14 shrink-0 cursor-pointer items-center rounded-full transition-colors duration-200 bg-primary">

</div>

</div>
</div>
</section>

<section class="grid grid-cols-3 gap-4">
<div class="col-span-2 p-6 bg-surface-container-low rounded-2xl flex flex-col justify-between">

<span class="font-headline text-5xl font-black text-neon-cyan">120</span>
<span class="font-label text-sm uppercase font-bold text-primary mb-1">FPS Active</span>

</div>
<div class="col-span-1 p-6 bg-secondary/10 rounded-2xl border border-secondary/20 flex flex-col items-center justify-center gap-2">
